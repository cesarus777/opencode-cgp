name: Stage npm package
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  publish:
    # Configure required reviewers and restrict this environment to version tags.
    environment: npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.1.34
      - run: npm install --global npm@11.21.0
      - id: release
        run: bun scripts/release.ts
      - run: bun install --frozen-lockfile
      - shell: bash
        run: |
          mkdir -p .artifacts
          bun run validate 2>&1 | tee .artifacts/validation.log
      - run: npm pack --dry-run
      - name: Stage package for maintainer approval
        shell: bash
        run: |
          npm stage publish --access public --provenance --tag "${{ steps.release.outputs.tag }}" 2>&1 | tee .artifacts/staging.log
      - name: Explain npm approval
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          Package staged successfully. It is awaiting maintainer approval and is not public yet.

          Review the stage ID in the staging step log, then open **Staged Packages** on npmjs.com and approve the package with 2FA.
          SUMMARY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: release-diagnostics
          path: .artifacts/
          if-no-files-found: ignore
          retention-days: 7
